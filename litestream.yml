access-key-id: ${BUCKETEER_AWS_ACCESS_KEY_ID}
secret-access-key: ${BUCKETEER_AWS_SECRET_ACCESS_KEY}
region: ${BUCKETEER_AWS_REGION}
sync-interval: 1s

dbs:
  - path: ${DB_PATH}
    restore-if-db-not-exists: true
    replica:
      type: s3
      bucket: ${BUCKETEER_BUCKET_NAME}
      path: autoapply/backend
