name: Weekly Personal Brand (inbound)

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC (after other Monday scans)
  workflow_dispatch:

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Draft weekly post (queue for approval)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
        run: python personal_brand.py
      - name: Commit queued post
        run: |
          git config user.email "agent@hsndm.tech"
          git config user.name "Hermes Agent"
          git add skills/personal-brand.md
          git diff --cached --quiet || git commit -m "brand: weekly post queued for approval" && git push
