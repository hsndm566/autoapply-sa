name: Weekly Personal Brand (inbound)

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC (after other Monday scans)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoapply-log-writers
  cancel-in-progress: false

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Draft weekly post (queue for approval)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
        run: python personal_brand.py
      - name: Commit queued post
        run: |
          git config user.email "agent@hsndm.tech"
          git config user.name "Hermes Agent"
          git add skills/personal-brand.md
          if ! git diff --cached --quiet; then
            git commit -m "brand: weekly post queued for approval"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
            done
            exit 1
          fi
