name: Brevo Read-Only Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/brevo-preflight.yml"
      - "brevo-preflight-trigger.txt"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
    steps:
      - name: Verify Brevo account, domain, and senders
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

          python - <<'PY'
          import json, os, urllib.request, urllib.error

          # Source the same Brevo key as the proven secure outbound batch workflow.
          # Never print or persist the key or the Supabase privileged credential.
          supabase_url = os.environ["SUPABASE_URL"].rstrip("/")
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          key_req = urllib.request.Request(
              supabase_url + "/rest/v1/rpc/get_secure_outbound_brevo_key",
              data=b"{}",
              headers={
                  "apikey": service_key,
                  "Authorization": "Bearer " + service_key,
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(key_req, timeout=20) as response:
              key = json.loads(response.read() or b'""')
          if not isinstance(key, str) or not key.strip():
              raise RuntimeError("Secure Brevo credential unavailable")
          key = key.strip()

          def get(path):
              req = urllib.request.Request(
                  "https://api.brevo.com/v3" + path,
                  headers={"api-key": key, "accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  print(f"BREVO_HTTP_ERROR={exc.code}")
                  try:
                      data = json.loads(body)
                      print("BREVO_ERROR_CODE=" + str(data.get("code") or "unknown"))
                  except Exception:
                      print("BREVO_ERROR_CODE=unknown")
                  if exc.code == 403 and path in ("/senders/domains", "/senders"):
                      print("BREVO_OPTIONAL_METADATA_ACCESS_DENIED=" + path)
                      return 403, {}
                  raise

          status, account = get("/account")
          if status != 200:
              raise SystemExit("Brevo account authentication failed")
          print("BREVO_ACCOUNT_OK=true")
          print("BREVO_PLAN_SEND_LIMIT_CREDITS=" + json.dumps([
              {"type": p.get("type"), "credits": p.get("credits")}
              for p in (account.get("plan") or [])
              if p.get("creditsType") == "sendLimit"
          ]))


          _, domains = get("/senders/domains")
          found_domain = None
          for d in domains.get("domains", []):
              name = (d.get("domain_name") or d.get("domain") or d.get("name") or "").lower()
              if name == "hsndm.tech":
                  found_domain = d
                  break

          print("HSNDM_DOMAIN_STATUS=" + ("not_accessible" if _ == 403 else ("present" if found_domain else "missing")))
          if found_domain:
              print("HSNDM_DOMAIN_AUTHENTICATED=" + str(bool(found_domain.get("authenticated"))).lower())
              print("HSNDM_DOMAIN_VERIFIED=" + str(bool(found_domain.get("verified"))).lower())

          _, senders = get("/senders")
          wanted = {"apply@hsndm.tech", "apply1@hsndm.tech", "apply2@hsndm.tech"}
          seen = {}
          for s in senders.get("senders", []):
              email = str(s.get("email") or "").lower()
              if email in wanted:
                  seen[email] = s

          for email in sorted(wanted):
              s = seen.get(email)
              print(email.upper().replace("@","_AT_").replace(".","_") + "_PRESENT=" + str(bool(s)).lower())
              if s:
                  active = s.get("active")
                  if active is not None:
                      print(email.upper().replace("@","_AT_").replace(".","_") + "_ACTIVE=" + str(bool(active)).lower())

          missing = sorted(wanted - set(seen)) if _ != 403 else []
          if missing:
              print("MISSING_SENDERS=" + ",".join(missing))
          print("BREVO_SENDERS_READ_ACCESS=" + str(_ == 200).lower())
          try:
              blocked_status, blocked = get("/smtp/blockedContacts?limit=1&offset=0")
              print("BREVO_BLOCKED_CONTACTS_ACCESS=" + str(blocked_status == 200).lower())
              if blocked_status == 200:
                  print("BREVO_BLOCKED_CONTACTS_COUNT=" + str(blocked.get("count", "unknown")))
          except urllib.error.HTTPError as exc:
              if exc.code in (401, 403):
                  print("BREVO_BLOCKED_CONTACTS_ACCESS=false")
              else:
                  raise
          PY
