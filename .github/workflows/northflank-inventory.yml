name: Northflank Source Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Stop stale topology inventory
        shell: bash
        run: |
          echo "::error::Migration inventory is paused because the canonical production topology changed."
          echo "Canonical Northflank workloads are the autoapply-api service (hsndm566/saudi-whatsapp-ai-chatbot) and autoapply-discovery-refresh job (hsndm566/autoapply-labs)."
          echo "The landing site and customer portal run on Cloudflare; the scheduled sender runs on GitHub Actions."
          echo "Do not migrate from the historical autoapply-sa/hsndm.tech2 Northflank assumptions."
          exit 2
