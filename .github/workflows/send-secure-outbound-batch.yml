name: Secure tailored outbound batch

on:
  push:
    branches: [main]
    paths:
      - "secure-batch-trigger.txt"

permissions:
  contents: read

concurrency:
  group: autoapply-secure-outbound-batch
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate protected credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Send queued tailored batches with pacing
        shell: bash
        run: |
          python - <<'PY'
          import json
          import base64
          import hashlib
          from zoneinfo import ZoneInfo
          import os
          import random
          import re
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          triggers = [
              line.strip()
              for line in open("secure-batch-trigger.txt", encoding="utf-8")
              if line.strip()
          ]
          if not triggers or len(triggers) > 10:
              raise SystemExit("Secure batch trigger list must contain 1-10 IDs")
          if any(not re.fullmatch(r"[0-9a-fA-F-]{36}", item) for item in triggers):
              raise SystemExit("Invalid secure batch trigger")

          supabase = os.environ["SUPABASE_URL"].rstrip("/")
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {
              "apikey": service_key,
              "Authorization": f"Bearer {service_key}",
              "Content-Type": "application/json",
          }

          def db_request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(supabase + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          brevo_key = db_request("POST", "/rest/v1/rpc/get_secure_outbound_brevo_key", {})
          if not isinstance(brevo_key, str) or not brevo_key.strip():
              raise SystemExit("Brevo credential unavailable from secure store")
          brevo_key = brevo_key.strip()

          total_accepted = 0
          for batch_number, trigger in enumerate(triggers, start=1):
              encoded = urllib.parse.quote(trigger, safe="")
              rows = db_request(
                  "GET",
                  f"/rest/v1/secure_outbound_batches?id=eq.{encoded}&state=eq.queued&select=id,sender_email,candidate_name,cv_filename,cv_base64,messages,state",
              )
              if not isinstance(rows, list) or len(rows) != 1:
                  raise SystemExit(f"Secure batch {batch_number} is missing, already consumed, or not uniquely queued")

              batch = rows[0]
              messages = batch.get("messages") or []
              if not isinstance(messages, list) or not 1 <= len(messages) <= 10:
                  raise SystemExit(f"Secure batch {batch_number} message count is outside the allowed 1-10 range")
              allowed_candidates = {
                  "Yasmin Adam": ("apply@hsndm.tech", "Yasmin_Adam_CV.pdf", "6e1a3f4534f06213749e990193db1f4efa009a411978423f868b1340a2a34262"),
                  "Sultan Saud": ("apply1@hsndm.tech", "SultanSaud.pdf", "99e499572bcaed6e4e9c7c8c21749a1abf326ba3ff4fa6730964046210fa013c"),
              }
              expected = allowed_candidates.get(batch.get("candidate_name"))
              if not expected or (batch.get("sender_email"), batch.get("cv_filename")) != expected[:2]:
                  raise SystemExit(f"Secure batch {batch_number} candidate/sender/CV identity mismatch")
              try:
                  pdf_bytes = base64.b64decode(batch.get("cv_base64") or "", validate=True)
              except (ValueError, base64.binascii.Error):
                  raise SystemExit(f"Secure batch {batch_number} has invalid PDF encoding")
              if (not pdf_bytes.startswith(b"%PDF-") or b"%%EOF" not in pdf_bytes[-2048:]
                      or hashlib.sha256(pdf_bytes).hexdigest() != expected[2]):
                  raise SystemExit(f"Secure batch {batch_number} PDF bytes do not match approved SHA-256")

              # Fail closed when today's candidate limit or Brevo's actual credit balance is insufficient.
              riyadh_now = datetime.now(timezone.utc).astimezone(ZoneInfo("Asia/Riyadh"))
              riyadh_midnight = riyadh_now.replace(hour=0, minute=0, second=0, microsecond=0)
              updated_since = urllib.parse.quote(riyadh_midnight.astimezone(timezone.utc).isoformat(), safe="")
              today = db_request(
                  "GET",
                  f"/rest/v1/secure_outbound_batches?updated_at=gte.{updated_since}&state=in.(sent,failed,sending)&select=candidate_name,result&limit=1000",
              )
              already_accepted = sum(
                  int((row.get("result") or {}).get("accepted") or 0)
                  for row in today if row.get("candidate_name") == batch["candidate_name"]
              )
              if already_accepted + len(messages) > 100:
                  raise SystemExit(f"Secure batch {batch_number} exceeds candidate's 100/day cap")

              acct_req = urllib.request.Request(
                  "https://api.brevo.com/v3/account",
                  headers={"api-key": brevo_key, "Accept": "application/json"},
              )
              with urllib.request.urlopen(acct_req, timeout=30) as response:
                  account = json.loads(response.read() or b"{}")
              balances = []
              for plan in account.get("plan") or []:
                  if plan.get("creditsType") == "sendLimit" and plan.get("type") != "sms":
                      try:
                          balances.append(int(plan["credits"]))
                      except (ValueError, TypeError, KeyError):
                          pass
              if not balances or max(balances) < len(messages):
                  raise SystemExit(f"Secure batch {batch_number} lacks verified Brevo sending credits")

              # Check the actual provider suppression list before accepting any new sends.
              # Fail closed if a page cannot be inspected. Never override unsubscribes.
              blocked_recipients = set()
              offset = 0
              while True:
                  blocked_req = urllib.request.Request(
                      "https://api.brevo.com/v3/smtp/blockedContacts?limit=100&offset=" + str(offset),
                      headers={"api-key": brevo_key, "Accept": "application/json"},
                  )
                  with urllib.request.urlopen(blocked_req, timeout=30) as response:
                      blocked_page = json.loads(response.read() or b"{}")
                  contacts = blocked_page.get("contacts") or []
                  blocked_recipients.update(
                      str(item.get("email") or "").strip().lower() for item in contacts
                  )
                  total_blocked = int(blocked_page.get("count") or 0)
                  offset += len(contacts)
                  if offset >= total_blocked:
                      break
                  if not contacts or offset >= 10000:
                      raise SystemExit("Could not fully inspect Brevo blocked contacts")
              if any(str(m.get("to") or "").strip().lower() in blocked_recipients for m in messages):
                  raise SystemExit(f"Secure batch {batch_number} contains a Brevo-blocked recipient")

              # Detect candidate-to-company AND candidate-to-address repeats from every
              # previous provider-accepted secure batch, even when the prior batch failed.
              history = db_request(
                  "GET",
                  "/rest/v1/secure_outbound_batches?state=in.(sent,failed,sending)&select=id,candidate_name,result&limit=1000",
              )
              previous_addresses = set()
              previous_companies = set()
              def normalize_company(value):
                  return re.sub(r"[^a-z0-9]+", "", str(value or "").casefold())
              for old in history:
                  if old.get("id") == batch["id"] or old.get("candidate_name") != batch["candidate_name"]:
                      continue
                  for prior in (old.get("result") or {}).get("messages") or []:
                      previous_addresses.add(str(prior.get("to") or "").strip().lower())
                      previous_companies.add(normalize_company(prior.get("company")))
              current_addresses, current_companies = set(), set()
              for message in messages:
                  address = str(message.get("to") or "").strip().lower()
                  company_key = normalize_company(message.get("company"))
                  if (not address or not company_key or address in previous_addresses
                          or company_key in previous_companies or address in current_addresses
                          or company_key in current_companies):
                      raise SystemExit(f"Secure batch {batch_number} has missing or duplicate recipient/company")
                  current_addresses.add(address)
                  current_companies.add(company_key)

              db_request("PATCH", f"/rest/v1/secure_outbound_batches?id=eq.{encoded}", {
                  "state": "sending",
                  "updated_at": datetime.now(timezone.utc).isoformat(),
                  "result": {"accepted": 0, "message_count": len(messages)},
              })

              accepted = []
              try:
                  for index, message in enumerate(messages, start=1):
                      recipient = str(message.get("to") or "").strip().lower()
                      subject = str(message.get("subject") or "").strip()
                      body = str(message.get("body") or "").strip()
                      company = str(message.get("company") or "").strip()
                      if not recipient or "@" not in recipient or not subject or len(body) < 120 or not company:
                          raise RuntimeError(f"Invalid message package at batch {batch_number} index {index}")

                      payload = {
                          "sender": {"email": batch["sender_email"], "name": batch["candidate_name"]},
                          "to": [{"email": recipient}],
                          "replyTo": {"email": batch["sender_email"], "name": batch["candidate_name"]},
                          "subject": subject,
                          "textContent": body,
                          "attachment": [{"name": batch["cv_filename"], "content": batch["cv_base64"]}],
                      }
                      req = urllib.request.Request(
                          "https://api.brevo.com/v3/smtp/email",
                          data=json.dumps(payload).encode("utf-8"),
                          headers={"api-key": brevo_key, "Content-Type": "application/json", "Accept": "application/json"},
                          method="POST",
                      )
                      with urllib.request.urlopen(req, timeout=30) as response:
                          provider = json.loads(response.read() or b"{}")
                      message_id = str(provider.get("messageId") or "").strip()
                      if not message_id:
                          raise RuntimeError(f"Brevo returned no messageId at batch {batch_number} index {index}")

                      accepted.append({
                          "index": index,
                          "to": recipient,
                          "company": company,
                          "messageId": message_id,
                      })
                      total_accepted += 1
                      print(json.dumps({
                          "batch": batch_number,
                          "accepted_in_batch": len(accepted),
                          "total_accepted": total_accepted,
                          "to": recipient,
                          "company": company,
                          "messageId": message_id,
                      }, sort_keys=True))

                      db_request("PATCH", f"/rest/v1/secure_outbound_batches?id=eq.{encoded}", {
                          "result": {
                              "accepted": len(accepted),
                              "message_count": len(messages),
                              "messages": accepted,
                          },
                          "updated_at": datetime.now(timezone.utc).isoformat(),
                      })

                      more_messages = index < len(messages)
                      more_batches = batch_number < len(triggers)
                      if more_messages or more_batches:
                          delay = random.randint(15, 25)
                          print(json.dumps({
                              "pacing_seconds": delay,
                              "next_batch": batch_number if more_messages else batch_number + 1,
                              "next_index": index + 1 if more_messages else 1,
                          }))
                          time.sleep(delay)

              except Exception as error:
                  db_request("PATCH", f"/rest/v1/secure_outbound_batches?id=eq.{encoded}", {
                      "state": "failed",
                      "result": {
                          "accepted": len(accepted),
                          "message_count": len(messages),
                          "messages": accepted,
                          "failure_type": type(error).__name__,
                      },
                      "updated_at": datetime.now(timezone.utc).isoformat(),
                  })
                  raise

              db_request("PATCH", f"/rest/v1/secure_outbound_batches?id=eq.{encoded}", {
                  "state": "sent",
                  "result": {
                      "accepted": len(accepted),
                      "message_count": len(messages),
                      "messages": accepted,
                  },
                  "updated_at": datetime.now(timezone.utc).isoformat(),
              })
              print(json.dumps({
                  "batch_complete": batch_number,
                  "accepted_in_batch": len(accepted),
                  "total_accepted": total_accepted,
              }))

          print(json.dumps({"all_batches_complete": True, "accepted": total_accepted}))
          PY
