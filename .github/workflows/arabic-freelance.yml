name: Daily Arabic Freelance Scan (Khamsat + Mostaql)

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily (early Saudi morning, catch fresh posts)
  workflow_dispatch:

jobs:
  arabic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Scan Khamsat + Mostaql, draft Arabic proposals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
        run: python arabic_freelance.py
      - name: Commit pipeline
        run: |
          git config user.email "agent@hsndm.tech"
          git config user.name "Hermes Agent"
          git add business/arabic-freelance-pipeline.md
          git diff --cached --quiet || git commit -m "arabic: daily freelance scan + proposals" && git push
