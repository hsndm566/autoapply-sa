name: Monthly Rejection Pattern Analysis

on:
  schedule:
    - cron: '0 4 1 * *'   # 1st of month, 04:00 UTC
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run monthly analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
        run: python -c "import orchestrator as o; print(o.monthly_rejection_analysis())"
      - name: Commit
        run: |
          git config user.email "agent@hsndm.tech"
          git config user.name "Hermes Agent"
          git add skills/rejection-patterns.md
          git diff --cached --quiet || git commit -m "rejection: monthly pattern analysis" && git push
