name: AutoApply Pipeline — Self-Healing Backend

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 min — self-diagnostics only
  workflow_dispatch:       # manual diagnostics only

jobs:
  # ---- 1. Self-Diagnostic Daemon (every 30 min) ----
  self-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ping Telegram bot health
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python -c "import urllib.request,os,json; tok=os.environ['TELEGRAM_BOT_TOKEN']; urllib.request.urlopen(urllib.request.Request('https://api.telegram.org/bot'+tok+'/getMe')); print('BOT OK')"
      - name: Ping Greenhouse endpoint
        run: |
          python -c "import urllib.request,json;urllib.request.urlopen(urllib.request.Request('https://boards-api.greenhouse.io/v1/boards/airbnb/jobs?content=false',headers={'User-Agent':'Mozilla/5'}),timeout=30);print('GH OK')" 2>&1
      - name: Rotate stale run
        run: echo "diagnostics complete"
