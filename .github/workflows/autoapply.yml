name: AutoApply Pipeline

on:
  schedule:
    - cron: '0 23 * * *'   # nightly 11pm UTC
  workflow_dispatch:       # manual trigger too

jobs:
  autossh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run AutoApply pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
          CV_PATH: "C:/Users/hasan/Downloads/Hasan Adam cv industrial engineering.pdf"
        run: |
          python orchestrator.py
      - name: Shutdown (done)
        if: always()
        run: echo "pipeline run complete"