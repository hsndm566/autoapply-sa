name: Weekly Business Health Report

on:
  schedule:
    - cron: '0 7 * * 0'   # every Sunday 07:00 UTC
  workflow_dispatch:

jobs:
  finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Build weekly business report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
        run: python business_model.py
      - name: Commit financial model
        run: |
          git config user.email "agent@hsndm.tech"
          git config user.name "Hermes Agent"
          git add business/financial-model.md
          git diff --cached --quiet || git commit -m "biz: weekly health + financial model" && git push
