name: CI Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Check submission chokepoints
        run: python check_submission_gate.py
      - name: Run approval gate tests
        run: pytest test_approval_gate.py -v
      - name: Run full pytest suite
        run: pytest -q
      - name: Run legacy unittest discovery
        run: python -m unittest discover -v
