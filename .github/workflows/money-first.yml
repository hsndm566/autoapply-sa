name: Daily Money-First (income now)

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 08:00 Saudi time, every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoapply-log-writers
  cancel-in-progress: false

jobs:
  money:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Pick today's ONE money action
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
        run: python money_first.py
      - name: Commit money-first log
        run: |
          git config user.email "agent@hsndm.tech"
          git config user.name "Hermes Agent"
          git add system/money-first-log.md
          if ! git diff --cached --quiet; then
            git commit -m "money: daily one-action log"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
