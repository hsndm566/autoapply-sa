name: Monthly System Audit (self-maintenance)

on:
  schedule:
    - cron: '0 8 1 * *'   # 1st of month, 08:00 UTC (after all other monthly runs)
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run system audit + auto-upgrade (free only)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
        run: python system_audit.py
      - name: Commit audit + applied upgrades
        run: |
          git config user.email "agent@hsndm.tech"
          git config user.name "Hermes Agent"
          git add system/monthly-audit.md skills/
          git diff --cached --quiet || git commit -m "audit: monthly self-maintenance (free upgrades applied)" && git push
