name: Daily Fast-Cash Scan

on:
  schedule:
    - cron: '30 5 * * *'   # 05:30 UTC daily (after money-first at 05:00)
  workflow_dispatch:

jobs:
  fastcash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Scan fast-cash tracks
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
        run: python fast_cash.py
      - name: Commit fast-cash log
        run: |
          git config user.email "agent@hsndm.tech"
          git config user.name "Hermes Agent"
          git add system/fast-cash-log.md
          git diff --cached --quiet || git commit -m "fastcash: daily scan" && git push
