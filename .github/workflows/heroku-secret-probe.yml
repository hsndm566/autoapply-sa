name: Heroku Secret Probe

on:
  push:
    branches: [ops/heroku-secret-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets without exposing values
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          JOB_IMPORT_TOKEN: ${{ secrets.JOB_IMPORT_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          for name in HEROKU_API_KEY ADMIN_API_TOKEN JOB_IMPORT_TOKEN RENDER_API_KEY; do
            if [ -n "${!name}" ]; then
              echo "$name=configured"
            else
              echo "$name=missing"
            fi
          done
