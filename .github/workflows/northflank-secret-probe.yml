name: Northflank Secret Probe

on:
  push:
    branches: [ops/northflank-secret-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check provider secrets without exposing values
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        shell: bash
        run: |
          for name in NORTHFLANK_API_TOKEN HEROKU_API_KEY; do
            if [ -n "${!name}" ]; then
              echo "$name=configured"
            else
              echo "$name=missing"
            fi
          done
