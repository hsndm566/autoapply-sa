name: AutoApply SA scheduled review preparation

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoapply-review-preflight
  cancel-in-progress: false

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare bounded application batch for human review
        env:
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          ENABLE_EMAIL_PERSONALIZATION: "false"
          EMAIL_OUTREACH_ENABLED: "false"
          AUTOAPPLY_SCHEDULED_DELIVERY: "false"
        run: python scheduled_review_preflight.py

  monitor-success:
    name: Signal review-preflight success
    needs: [prepare-review]
    if: ${{ needs.prepare-review.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
    steps:
      - name: Ping Healthchecks.io when configured
        if: ${{ env.HEALTHCHECKS_URL != '' }}
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 10 --retry 3 "$HEALTHCHECKS_URL"

  monitor-failure:
    name: Signal review-preflight failure
    needs: [prepare-review]
    if: ${{ always() && needs.prepare-review.result == 'failure' }}
    runs-on: ubuntu-latest
    env:
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
    steps:
      - name: Ping Healthchecks.io failure endpoint when configured
        if: ${{ env.HEALTHCHECKS_URL != '' }}
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 10 --retry 3 "${HEALTHCHECKS_URL%/}/fail"
