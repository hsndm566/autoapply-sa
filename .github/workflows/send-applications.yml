name: Legacy application delivery guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired-path:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify approval chokepoints
        run: python check_submission_gate.py

      - name: Confirm legacy delivery remains disabled
        run: |
          test ! -f clients.csv
          test ! -d cvs
          echo "Legacy file-backed sender is retired. Production campaign discovery/review runs through the service datastore."
