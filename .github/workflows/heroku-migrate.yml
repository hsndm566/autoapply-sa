name: Heroku Migration Controller

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ops/heroku-deploy-request.json

permissions:
  contents: read

concurrency:
  group: autoapply-heroku-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: heroku-migration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify required encrypted credentials exist
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$HEROKU_API_KEY" || { echo "HEROKU_API_KEY repository secret is missing"; exit 2; }
          test -n "$RENDER_API_KEY" || { echo "RENDER_API_KEY repository secret is missing"; exit 2; }

      - name: Run staged Render to Heroku migration
        id: migration
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python ops/heroku_migrate.py --request ops/heroku-deploy-request.json

      - name: Record safe migration summary
        if: success()
        shell: bash
        run: |
          echo "Heroku staging migration completed."
          echo "Production DNS and traffic were not changed."
